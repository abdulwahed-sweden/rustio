[package]
name = "rustio-cli"
description = "The `rustio` command-line tool: scaffold projects, run migrations, launch servers, manage users."
readme = "README.md"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "rustio"
path = "src/main.rs"

[dependencies]
rustio-core = { path = "../rustio-core", version = "1.7.1" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
env_logger = "0.11"
log = "0.4"
rpassword = "7"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "macros",
] }
# v1.5.0 — `rustio doctor` only. dotenvy mirrors what the scaffold's
# MAIN_RS does at runtime (so doctor reads the same .env). url parses
# DATABASE_URL into host/port/user/password/dbname for the TCP probe
# and the password-masked render.
dotenvy = "0.15"
url = "2"
# v1.7.1 — `version_check` module. ureq does the one-shot crates.io
# GET on a detached background thread (rustls-tls default, no
# system OpenSSL). semver parses + compares versions; matches what
# cargo itself uses.
ureq = "2"
semver = "1"

[dev-dependencies]
# Phase 12/a — structural parse of the scaffolded `.rustio/project.lock`
# in tests. Substring asserts catch typos; toml-parse catches malformed
# TOML before it ships in a release.
toml = "0.8"
