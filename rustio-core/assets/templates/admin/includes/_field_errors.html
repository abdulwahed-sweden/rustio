{# Render a list of field errors. Caller passes `errors`
   (an iterable of strings); empty iterables render nothing. #}
{% if errors %}
<div class="errornote">
    <div class="flex items-start gap-2">
        <span class="mt-0.5 shrink-0">{{ icon("circle-alert", class="w-4 h-4") }}</span>
        <ul class="space-y-1 m-0 p-0 list-none">
            {% for err in errors %}
            <li>{{ err }}</li>
            {% endfor %}
        </ul>
    </div>
</div>
{% endif %}
