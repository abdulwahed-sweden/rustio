{% extends "admin/base.html" %}

{% block content %}
<div class="page-header">
    <h1>Groups</h1>
</div>

{% if groups %}
<table class="data-table">
    <thead>
        <tr>
            <th>#</th>
            <th>Name</th>
            <th>Description</th>
            <th class="actions-col">Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for g in groups %}
        <tr>
            <td>{{ g.id }}</td>
            <td><strong>{{ g.name }}</strong></td>
            <td class="muted">{{ g.description }}</td>
            <td class="actions-col">
                <a href="/admin/groups/{{ g.id }}/edit">Edit</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<p class="muted">No groups yet. Create one from the CLI: <code>rustio group create &lt;name&gt;</code></p>
{% endif %}
{% endblock %}
