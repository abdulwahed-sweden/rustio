{# The footer strip in the main column: project name and framework
   version. Sits in the content grid's second row, like rustio-lite's. #}
<footer class="app-footer">
  <span>{{ design.project_name | default('RustIO') }}</span>
  {% if rustio_version is defined and rustio_version %}
    <span>v{{ rustio_version }}</span>
  {% endif %}
</footer>
