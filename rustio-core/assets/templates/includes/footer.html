{# Subdued status bar at the bottom of every admin page. Neutral
   gray ladder only — no accent, no cursor, no blink. #}
<footer class="rio-statusbar">
  <span>{{ design.project_name | default('RustIO') }}</span>
  {% if rustio_version is defined and rustio_version %}
    <span class="rio-statusbar__sep">·</span>
    <span>v{{ rustio_version }}</span>
  {% endif %}
  <span class="rio-statusbar__spacer"></span>
</footer>
