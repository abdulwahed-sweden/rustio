# Excluded from the workspace so it builds standalone against the
# adjacent rustio-core source tree (matches how an end-user project
# would consume the framework via crates.io).
[workspace]

[package]
name = "bookflow"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bookflow"
path = "main.rs"

[dependencies]
rustio-core = { path = "../../rustio-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# `chrono` is used for `DateTime<Utc>` model fields across the booking models.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
